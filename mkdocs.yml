site_name: Cường Kelvin

theme:
  name: material
  language: vi
  features:
    - navigation.tabs        # chủ đề thành tab trên đầu
    - navigation.sections
    - navigation.indexes     # index.md làm trang tổng quan của chủ đề
    - navigation.top         # nút cuộn lên đầu trang
    - search.suggest
    - search.highlight
    - content.code.copy      # nút copy cho khối code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Chuyển sang tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Chuyển sang sáng

plugins:
  - search
  - awesome-pages            # đặt tên/thứ tự tab bằng file .pages trong mỗi thư mục

markdown_extensions:
  - admonition               # khung ghi chú !!! note
  - pymdownx.arithmatex:     # công thức toán: $...$ và $$...$$
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_javascript:
  - javascripts/mathjax.js   # cấu hình MathJax cho arithmatex
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

