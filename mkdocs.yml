site_name: Cường Kelvin

theme:
  name: material
  language: vi
  features:
    - navigation.tabs        # chủ đề thành tab trên đầu
    - navigation.indexes     # index.md làm trang tổng quan của chủ đề
    - navigation.top         # nút cuộn lên đầu trang
    - navigation.footer      # nút trang trước / trang sau ở cuối bài
    - navigation.tracking    # URL tự cập nhật #đề-mục khi cuộn
    - navigation.instant     # chuyển trang không tải lại, thanh trái giữ vị trí cuộn
    - navigation.instant.progress
    - toc.follow             # mục lục bên phải tự cuộn theo phần đang đọc
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy      # nút copy cho khối code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Chuyển sang tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Chuyển sang sáng

plugins:
  - search
  - awesome-pages            # đặt tên/thứ tự tab bằng file .pages trong mỗi thư mục

markdown_extensions:
  - admonition               # khung ghi chú !!! note
  - pymdownx.arithmatex:     # công thức toán: $...$ và $$...$$
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css    # font JetBrains Mono tự host cho khối code (sơ đồ box-drawing thẳng cột)

extra_javascript:
  - javascripts/nav-toggle.js   # nút ẩn/hiện thanh điều hướng trái trên header
  - javascripts/goatcounter.js  # đếm lượt xem (cuongkelvin.goatcounter.com)
  - javascripts/mathjax.js   # cấu hình MathJax cho arithmatex
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

